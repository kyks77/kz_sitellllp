<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог — Oyan Bala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #0055A4;
      --blue-dark: #003d7a;
      --blue-light: #1a6fc4;
      --gold: #F5C518;
      --white: #FAFBFF;
      --offwhite: #F0F4FF;
      --text: #0a1628;
      --text-muted: #4a6080;
      --border: #dce6f5;
      --sidebar-w: 260px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--offwhite); color: var(--text); display: flex; min-height: 100vh; }

    /* ── SIDEBAR (same as home) ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: linear-gradient(175deg, #003d7a 0%, #0055A4 100%);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
    }
    .sidebar-logo {
      padding: 28px 28px 24px;
      font-family: 'Unbounded', sans-serif; font-size: 1.15rem; font-weight: 900;
      color: var(--white); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-logo span { color: var(--gold); }
    .sidebar-profile {
      padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 12px;
    }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.3); }
    .profile-info .name { font-weight: 700; color: var(--white); font-size: 0.9rem; }
    .profile-info .role { font-size: 0.75rem; color: rgba(255,255,255,0.55); margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 12px;
      text-decoration: none; color: rgba(255,255,255,0.7);
      font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
      border: none; background: none; width: 100%; text-align: left; cursor: pointer;
    }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: var(--white); }
    .nav-item.active { background: rgba(245,197,24,0.15); color: var(--gold); }
    .nav-icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--gold); color: var(--blue-dark); font-size: 0.7rem; font-weight: 800; border-radius: 50px; padding: 2px 8px; }
    .sidebar-bottom { padding: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
    .logout-btn { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 12px; color: rgba(255,255,255,0.5); font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.2s; }
    .logout-btn:hover { color: #fc8181; background: rgba(252,129,129,0.1); }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 18px 40px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 40;
    }
    .topbar-left h1 { font-family: 'Unbounded', sans-serif; font-size: 1.2rem; font-weight: 900; }
    .topbar-left p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .notif-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--offwhite); border: none; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; position: relative; }
    .notif-btn:hover { background: var(--border); }
    .notif-dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
    .mob-menu { display: none; }

    /* ── CONTENT ── */
    .content { padding: 32px 40px; flex: 1; }

    /* SEARCH BAR */
    .search-row {
      display: flex; gap: 12px; margin-bottom: 24px; align-items: center;
    }
    .search-wrap {
      flex: 1; position: relative;
    }
    .search-wrap input {
      width: 100%; padding: 14px 18px 14px 48px;
      border: 2px solid var(--border); border-radius: 14px;
      font-family: 'Nunito', sans-serif; font-size: 0.95rem;
      background: var(--white); color: var(--text);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-wrap input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,85,164,0.1); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; pointer-events: none; }
    .sort-select {
      padding: 14px 18px; border-radius: 14px;
      border: 2px solid var(--border); background: var(--white);
      font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 700;
      color: var(--text); outline: none; cursor: pointer; min-width: 180px;
      transition: border-color 0.2s;
    }
    .sort-select:focus { border-color: var(--blue); }
    .view-toggle { display: flex; gap: 4px; background: var(--white); border: 2px solid var(--border); border-radius: 12px; padding: 4px; }
    .view-btn { width: 36px; height: 36px; border: none; border-radius: 8px; background: none; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .view-btn.active { background: var(--blue); }

    /* LAYOUT */
    .catalogue-layout { display: flex; gap: 24px; align-items: flex-start; }

    /* FILTERS SIDEBAR */
    .filters-panel {
      width: 240px; flex-shrink: 0;
      background: var(--white); border-radius: 20px;
      border: 1px solid var(--border); padding: 24px;
      position: sticky; top: 90px;
    }
    .filter-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 0.85rem; font-weight: 700; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .filter-clear { font-family: 'Nunito', sans-serif; font-size: 0.8rem; color: var(--blue); cursor: pointer; font-weight: 600; background: none; border: none; }
    .filter-clear:hover { text-decoration: underline; }
    .filter-group { margin-bottom: 24px; }
    .filter-group-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }

    /* category pills */
    .cat-pills { display: flex; flex-direction: column; gap: 6px; }
    .cat-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 10px;
      cursor: pointer; transition: all 0.2s;
      border: 2px solid transparent; background: var(--offwhite);
      font-size: 0.875rem; font-weight: 600; color: var(--text);
      user-select: none;
    }
    .cat-pill:hover { background: #e4ecf8; }
    .cat-pill.selected { background: rgba(0,85,164,0.08); border-color: var(--blue); color: var(--blue); }
    .cat-pill .pill-count { margin-left: auto; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .cat-pill.selected .pill-count { color: var(--blue); }

    /* age range */
    .age-row { display: flex; gap: 8px; }
    .age-btn {
      flex: 1; padding: 8px 4px; text-align: center;
      border: 2px solid var(--border); border-radius: 10px;
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
      background: var(--offwhite); color: var(--text-muted);
      transition: all 0.2s;
    }
    .age-btn.selected { border-color: var(--blue); color: var(--blue); background: rgba(0,85,164,0.07); }

    /* district */
    .district-select {
      width: 100%; padding: 10px 12px;
      border: 2px solid var(--border); border-radius: 10px;
      font-family: 'Nunito', sans-serif; font-size: 0.875rem; font-weight: 600;
      color: var(--text); background: var(--offwhite); outline: none; cursor: pointer;
    }
    .district-select:focus { border-color: var(--blue); }

    /* free only toggle */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-label { font-size: 0.875rem; font-weight: 600; }
    .toggle {
      width: 42px; height: 24px; border-radius: 50px;
      background: var(--border); cursor: pointer; position: relative;
      transition: background 0.25s; border: none;
    }
    .toggle.on { background: var(--blue); }
    .toggle::after {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--white); top: 3px; left: 3px;
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .toggle.on::after { transform: translateX(18px); }

    /* RESULTS */
    .results-area { flex: 1; min-width: 0; }
    .results-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .results-count { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    .results-count strong { color: var(--text); }

    /* active filters chips */
    .active-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 50px;
      background: rgba(0,85,164,0.1); color: var(--blue);
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .filter-chip:hover { background: rgba(0,85,164,0.18); }

    /* GRID */
    .sections-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .sections-grid.list-view { grid-template-columns: 1fr; }

    /* SECTION CARD */
    .sec-card {
      background: var(--white); border-radius: 20px;
      border: 1px solid var(--border); overflow: hidden;
      transition: transform 0.22s, box-shadow 0.22s;
      cursor: pointer; text-decoration: none; color: var(--text);
      display: flex; flex-direction: column;
    }
    .sec-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,85,164,0.12); }

    .sec-card-img {
      height: 140px; display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; position: relative;
    }
    .sec-badge {
      position: absolute; top: 12px; left: 12px;
      background: var(--white); border-radius: 8px;
      padding: 4px 10px; font-size: 0.75rem; font-weight: 700; color: var(--blue);
    }
    .sec-badge.free { background: #f0fff4; color: #276749; }
    .sec-rating-badge {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
      color: var(--white); border-radius: 8px;
      padding: 4px 10px; font-size: 0.78rem; font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }

    .sec-card-body { padding: 18px 20px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .sec-card-sport {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--blue); opacity: 0.75;
    }
    .sec-card-name { font-family: 'Unbounded', sans-serif; font-size: 0.92rem; font-weight: 700; line-height: 1.3; }
    .sec-card-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
    .sec-meta-item { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
    .sec-card-footer {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sec-age { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
    .enroll-btn {
      padding: 8px 18px; background: var(--blue); color: var(--white);
      border: none; border-radius: 10px; font-family: 'Nunito', sans-serif;
      font-size: 0.82rem; font-weight: 800; cursor: pointer;
      transition: background 0.2s; text-decoration: none;
    }
    .enroll-btn:hover { background: var(--blue-dark); }

    /* list view card */
    .sections-grid.list-view .sec-card { flex-direction: row; }
    .sections-grid.list-view .sec-card-img { width: 120px; height: auto; flex-shrink: 0; border-radius: 0; font-size: 2.5rem; }
    .sections-grid.list-view .sec-card-body { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px; }
    .sections-grid.list-view .sec-card-name { flex: 1; min-width: 180px; }
    .sections-grid.list-view .sec-card-footer { border-top: none; border-left: 1px solid var(--border); flex-direction: column; gap: 8px; min-width: 100px; }

    /* no results */
    .no-results { text-align: center; padding: 80px 20px; color: var(--text-muted); }
    .no-results .emoji { font-size: 3rem; margin-bottom: 16px; }
    .no-results h3 { font-family: 'Unbounded', sans-serif; font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }

    /* pagination */
    .pagination { display: flex; gap: 8px; justify-content: center; margin-top: 32px; }
    .page-btn {
      width: 38px; height: 38px; border-radius: 10px;
      border: 2px solid var(--border); background: var(--white);
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: all 0.2s; color: var(--text);
    }
    .page-btn:hover { border-color: var(--blue); color: var(--blue); }
    .page-btn.active { background: var(--blue); border-color: var(--blue); color: var(--white); }

    @media (max-width: 1100px) { .filters-panel { display: none; } }
    @media (max-width: 860px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .mob-menu { display: flex; }
      .content { padding: 24px 16px; }
      .topbar { padding: 14px 16px; }
      .sections-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <a class="sidebar-logo" href="landing.html">✦ Oyan <span>Bala</span></a>
  <div class="sidebar-profile">
    <div class="avatar">👩</div>
    <div class="profile-info">
      <div class="name">Айгүл Сейткалиева</div>
      <div class="role">Ата-ана</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item" href="home.html"><span class="nav-icon">🏠</span> Басты бет</a>
    <a class="nav-item" href="map.html"><span class="nav-icon">🗺️</span> Карта</a>
    <a class="nav-item active" href="catalogue.html"><span class="nav-icon">📋</span> Каталог <span class="nav-badge">200+</span></a>
    <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span> Жеке кабинет</a>
    <a class="nav-item" href="landing.html#about"><span class="nav-icon">ℹ️</span> Жоба туралы</a>
  </nav>
  <div class="sidebar-bottom">
    <button class="logout-btn" onclick="window.location.href='login.html'"><span>🚪</span> Шығу</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="notif-btn mob-menu" onclick="document.getElementById('sidebar').classList.toggle('open')" style="font-size:1.3rem">☰</button>
      <div class="topbar-left">
        <h1>Каталог</h1>
        <p>Барлық спорт секциялары</p>
      </div>
    </div>
    <div class="topbar-right">
      <button class="notif-btn">🔔<div class="notif-dot"></div></button>
      <div class="avatar" style="cursor:pointer" onclick="window.location.href='profile.html'">👩</div>
    </div>
  </div>

  <div class="content">

    <!-- SEARCH ROW -->
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Секция атын іздеу..." oninput="renderCards()" />
      </div>
      <select class="sort-select" id="sort-select" onchange="renderCards()">
        <option value="rating">Рейтинг бойынша</option>
        <option value="name">Аты бойынша (А-Я)</option>
        <option value="dist">Қашықтық бойынша</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" id="grid-btn" onclick="setView('grid')" title="Тор">⊞</button>
        <button class="view-btn" id="list-btn" onclick="setView('list')" title="Тізім">☰</button>
      </div>
    </div>

    <div class="catalogue-layout">

      <!-- FILTERS -->
      <div class="filters-panel">
        <div class="filter-title">
          Сүзгілер
          <button class="filter-clear" onclick="clearFilters()">Тазалау</button>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Спорт түрі</div>
          <div class="cat-pills" id="cat-pills"></div>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Жас тобы</div>
          <div class="age-row">
            <div class="age-btn" onclick="toggleAge(this,'5-8')">5–8</div>
            <div class="age-btn" onclick="toggleAge(this,'9-12')">9–12</div>
            <div class="age-btn" onclick="toggleAge(this,'13-17')">13–17</div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Аудан</div>
          <select class="district-select" id="district-select" onchange="renderCards()">
            <option value="">Барлық аудандар</option>
            <option>Бостандық</option>
            <option>Алмалы</option>
            <option>Медеу</option>
            <option>Ауэзов</option>
            <option>Жетісу</option>
            <option>Түрксіб</option>
          </select>
        </div>

        <div class="filter-group">
          <div class="filter-group-title">Ақылы / Тегін</div>
          <div class="toggle-row">
            <span class="toggle-label">Тек тегін</span>
            <button class="toggle" id="free-toggle" onclick="toggleFree()"></button>
          </div>
        </div>
      </div>

      <!-- RESULTS -->
      <div class="results-area">
        <div class="results-header">
          <div class="results-count">Табылды: <strong id="count">0</strong> секция</div>
        </div>
        <div class="active-filters" id="active-filters"></div>
        <div class="sections-grid" id="sections-grid"></div>
        <div class="no-results" id="no-results" style="display:none">
          <div class="emoji">🔍</div>
          <h3>Секция табылмады</h3>
          <p>Сүзгілерді өзгертіп көріңіз</p>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SPORTS = [
  { emoji:'⚽', name:'Футбол',      color:'#0055A4,#1a6fc4' },
  { emoji:'🥊', name:'Бокс',       color:'#c9a00a,#F5C518' },
  { emoji:'🤸', name:'Гимнастика', color:'#276749,#38a169' },
  { emoji:'🏊', name:'Жүзу',       color:'#553c9a,#805ad5' },
  { emoji:'🏹', name:'Садақ ату',  color:'#c05621,#ed8936' },
  { emoji:'🤼', name:'Күрес',      color:'#822727,#e53e3e' },
  { emoji:'🏀', name:'Баскетбол',  color:'#7b341e,#dd6b20' },
  { emoji:'🥋', name:'Дзюдо',      color:'#1a365d,#2b6cb0' },
  { emoji:'🏇', name:'Ат спорты',  color:'#44337a,#6b46c1' },
  { emoji:'🎿', name:'Шаңғы',      color:'#1a4971,#2c7eb8' },
];

const DISTRICTS = ['Бостандық','Алмалы','Медеу','Ауэзов','Жетісу','Түрксіб'];
const NAMES_PREFIX = ['Жас Өркен','ЦСКА','Алматы','Достық','Барыс','Нұр','Қазақ Ұлттық','Жетісу','Болашақ','Спартак'];
const NAMES_SUFFIX = ['Академиясы','Клубы','Орталығы','Спорт Мектебі','Секциясы','Дайындық Орталығы'];

// Generate 60 mock sections
const sections = [];
let id = 1;
SPORTS.forEach(sport => {
  const count = sport.name === 'Футбол' ? 8 : sport.name === 'Бокс' ? 7 : 6;
  for (let i = 0; i < count; i++) {
    const district = DISTRICTS[Math.floor(Math.random() * DISTRICTS.length)];
    const dist = (Math.random() * 6 + 0.5).toFixed(1);
    const rating = (4.2 + Math.random() * 0.8).toFixed(1);
    const free = Math.random() > 0.6;
    const minAge = [5,6,7,8,9][Math.floor(Math.random()*5)];
    const maxAge = minAge + [4,5,6,7,8][Math.floor(Math.random()*5)];
    const prefix = NAMES_PREFIX[Math.floor(Math.random()*NAMES_PREFIX.length)];
    const suffix = NAMES_SUFFIX[Math.floor(Math.random()*NAMES_SUFFIX.length)];
    sections.push({ id: id++, sport: sport.name, emoji: sport.emoji, color: sport.color,
      name: `${prefix} ${sport.name} ${suffix}`, district, dist: parseFloat(dist),
      rating: parseFloat(rating), free, minAge, maxAge,
      schedule: ['Дс,Ср,Жм','Сс,Жк,Сн','Дс,Ср,Жм,Жк','Сс,Жк'][Math.floor(Math.random()*4)],
    });
  }
});

// State
let selectedCats = new Set();
let selectedAge = null;
let freeOnly = false;
let currentView = 'grid';
let currentPage = 1;
const PER_PAGE = 12;

// Build category pills
const pillsContainer = document.getElementById('cat-pills');
SPORTS.forEach(s => {
  const count = sections.filter(x => x.sport === s.name).length;
  const el = document.createElement('div');
  el.className = 'cat-pill';
  el.dataset.sport = s.name;
  el.innerHTML = `<span>${s.emoji}</span> ${s.name} <span class="pill-count">${count}</span>`;
  el.onclick = () => { toggleCat(s.name); el.classList.toggle('selected'); renderCards(); };
  pillsContainer.appendChild(el);
});

function toggleCat(name) { selectedCats.has(name) ? selectedCats.delete(name) : selectedCats.add(name); }
function toggleAge(el, range) {
  const wasSelected = el.classList.contains('selected');
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
  selectedAge = wasSelected ? null : range;
  if (!wasSelected) el.classList.add('selected');
  renderCards();
}
function toggleFree() {
  freeOnly = !freeOnly;
  document.getElementById('free-toggle').classList.toggle('on', freeOnly);
  renderCards();
}
function clearFilters() {
  selectedCats.clear();
  selectedAge = null;
  freeOnly = false;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('selected'));
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('free-toggle').classList.remove('on');
  document.getElementById('district-select').value = '';
  document.getElementById('search-input').value = '';
  renderCards();
}
function setView(v) {
  currentView = v;
  document.getElementById('sections-grid').classList.toggle('list-view', v === 'list');
  document.getElementById('grid-btn').classList.toggle('active', v === 'grid');
  document.getElementById('list-btn').classList.toggle('active', v === 'list');
}

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const district = document.getElementById('district-select').value;
  const sort = document.getElementById('sort-select').value;
  let res = sections.filter(s => {
    if (selectedCats.size > 0 && !selectedCats.has(s.sport)) return false;
    if (district && s.district !== district) return false;
    if (freeOnly && !s.free) return false;
    if (q && !s.name.toLowerCase().includes(q) && !s.sport.toLowerCase().includes(q)) return false;
    if (selectedAge) {
      const [lo,hi] = selectedAge.split('-').map(Number);
      if (s.maxAge < lo || s.minAge > hi) return false;
    }
    return true;
  });
  if (sort === 'rating') res.sort((a,b) => b.rating - a.rating);
  else if (sort === 'name') res.sort((a,b) => a.name.localeCompare(b.name, 'kk'));
  else if (sort === 'dist') res.sort((a,b) => a.dist - b.dist);
  return res;
}

function renderCards() {
  currentPage = 1;
  renderPage();
}

function renderPage() {
  const filtered = getFiltered();
  const grid = document.getElementById('sections-grid');
  const noRes = document.getElementById('no-results');
  const countEl = document.getElementById('count');
  const pagEl = document.getElementById('pagination');

  countEl.textContent = filtered.length;

  // active filter chips
  const af = document.getElementById('active-filters');
  af.innerHTML = '';
  if (selectedCats.size > 0) selectedCats.forEach(c => {
    af.innerHTML += `<div class="filter-chip" onclick="removeCat('${c}')">${c} ✕</div>`;
  });
  if (selectedAge) af.innerHTML += `<div class="filter-chip" onclick="removeAge()">${selectedAge} жас ✕</div>`;
  if (freeOnly) af.innerHTML += `<div class="filter-chip" onclick="toggleFree()">Тегін ✕</div>`;

  if (filtered.length === 0) { grid.innerHTML = ''; noRes.style.display = 'block'; pagEl.innerHTML = ''; return; }
  noRes.style.display = 'none';

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const page = filtered.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

  grid.innerHTML = page.map(s => `
    <a href="section.html" class="sec-card">
      <div class="sec-card-img" style="background:linear-gradient(135deg,#${s.color.split(',')[0].replace('#','')},#${s.color.split(',')[1].replace('#','')})">
        ${s.emoji}
        <span class="sec-badge ${s.free?'free':''}">${s.free ? '✓ Тегін' : '💳 Ақылы'}</span>
        <span class="sec-rating-badge">⭐ ${s.rating}</span>
      </div>
      <div class="sec-card-body">
        <div class="sec-card-sport">${s.sport}</div>
        <div class="sec-card-name">${s.name}</div>
        <div class="sec-card-meta">
          <span class="sec-meta-item">📍 ${s.district}</span>
          <span class="sec-meta-item">🚶 ${s.dist} км</span>
          <span class="sec-meta-item">📅 ${s.schedule}</span>
        </div>
      </div>
      <div class="sec-card-footer">
        <span class="sec-age">👦 ${s.minAge}–${s.maxAge} жас</span>
        <a href="section.html" class="enroll-btn">Жазылу →</a>
      </div>
    </a>
  `).join('');

  // pagination
  pagEl.innerHTML = '';
  if (totalPages <= 1) return;
  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => { currentPage = i; renderPage(); window.scrollTo(0,0); };
    pagEl.appendChild(btn);
  }
}

function removeCat(name) {
  selectedCats.delete(name);
  document.querySelectorAll('.cat-pill').forEach(p => { if(p.dataset.sport === name) p.classList.remove('selected'); });
  renderCards();
}
function removeAge() { selectedAge = null; document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected')); renderCards(); }

// close sidebar on outside click
document.addEventListener('click', e => {
  const sb = document.getElementById('sidebar');
  if (sb.classList.contains('open') && !sb.contains(e.target)) sb.classList.remove('open');
});

// Init
renderCards();
</script>
</body>
</html>
